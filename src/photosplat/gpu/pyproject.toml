[project]
name = "photo-to-splat-gpu"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "nerfstudio==1.1.5", "gsplat==1.4.0",
  "numpy==1.26.4", "tyro==0.9.35", "setuptools==80.9.0", "ninja==1.13.0"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
