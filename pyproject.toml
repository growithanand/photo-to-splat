[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "photo-to-splat"
version = "0.1.0"
description = "A local, guided workspace for reproducible Gaussian splatting from photographs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<14", "filelock>=3.17,<4", "psutil>=6,<8"
]

[project.scripts]
photosplat = "photosplat.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/photosplat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
